name: Argos Trade B3 · triagem de ações e FIIs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backtest/triagem.py"
      - ".github/workflows/triagem.yml"

permissions:
  contents: write

concurrency:
  group: triagem
  cancel-in-progress: true

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Medir ações e FIIs
        working-directory: backtest
        run: python triagem.py triagem

      - name: Salvar no repositório
        run: |
          git config user.name "argos-trade-b3"
          git config user.email "argos-trade-b3@users.noreply.github.com"
          git add backtest/TRIAGEM.md backtest/triagem/
          git diff --cached --quiet || git commit -m "Argos Trade B3: triagem de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git pull --rebase
          git push
