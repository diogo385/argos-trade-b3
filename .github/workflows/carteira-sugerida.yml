name: Argos Trade B3 · backtest da carteira sugerida

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backtest/carteira_sugerida.py"
      - ".github/workflows/carteira-sugerida.yml"

permissions:
  contents: write

concurrency:
  group: carteira-sugerida
  cancel-in-progress: true

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Simular a carteira sugerida
        working-directory: backtest
        run: python carteira_sugerida.py resultado

      - name: Salvar no repositório
        run: |
          git config user.name "argos-trade-b3"
          git config user.email "argos-trade-b3@users.noreply.github.com"
          git add backtest/CARTEIRA_SUGERIDA.md backtest/resultado/curvas_carteira_sugerida.csv
          git diff --cached --quiet || git commit -m "Argos Trade B3: backtest da carteira sugerida de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git pull --rebase
          git push
