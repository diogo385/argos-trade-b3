name: Argos Trade B3 · robô simulado

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 18h30 de Brasília, dias úteis (feriados: o robô percebe e não opera)
  workflow_dispatch:           # botão "Run workflow" para rodar na hora
    inputs:
      teste_telegram:
        description: "Só testar o Telegram (não mexe na carteira)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: robo-simulado
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o robô simulado
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TESTE_TELEGRAM: ${{ github.event.inputs.teste_telegram }}
        run: python simulado/robo_b3.py

      - name: Salvar a carteira simulada no repositório
        if: always()
        run: |
          git config user.name "argos-trade-b3"
          git config user.email "argos-trade-b3@users.noreply.github.com"
          git add simulado/
          git diff --cached --quiet || git commit -m "Argos Trade B3 (simulado): fechamento de $(TZ=America/Sao_Paulo date '+%d/%m/%Y')"
          git pull --rebase
          git push
