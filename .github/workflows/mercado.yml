name: Argos Trade B3 · relógio (cotações do dia e disparo do robô)

# O agendador do GitHub atrasa horas neste repositório. Este job fica rodando e faz uma passada a cada 10 minutos:
# publica as cotações durante o pregão, dispara o robô às 19h15 e o sinal de vida às 21h15.
# Perto do limite de 6 horas, ele dispara o próprio sucessor. O agendamento abaixo só serve para religar a
# corrente se ela cair (por exemplo, depois de uma manutenção do GitHub).
on:
  schedule:
    - cron: "11 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mercado
  cancel-in-progress: true   # uma execução nova assume o lugar da anterior

jobs:
  relogio:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Uma passada a cada 10 minutos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          inicio=$(date +%s)
          while true; do
            git pull -q || true                      # pega correções do código sem reiniciar a corrente
            rm -rf /tmp/mercado && mkdir -p /tmp/mercado
            python simulado/relogio.py /tmp/mercado/mercado.json || echo "passada com erro; sigo na próxima"
            if [ -f /tmp/mercado/mercado.json ]; then
              ( cd /tmp/mercado && git init -q -b mercado \
                && git config user.name "argos-trade-b3" && git config user.email "argos-trade-b3@users.noreply.github.com" \
                && git add mercado.json && git commit -q -m "Cotações de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')" \
                && git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mercado ) || true
            fi
            if [ $(( $(date +%s) - inicio )) -ge 19200 ]; then   # 5h20: passa o bastão antes do limite de 6 horas
              curl -s -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mercado.yml/dispatches" -d '{"ref":"main"}'
              sleep 120   # o sucessor cancela esta execução ao começar
              break
            fi
            sleep 600
          done
