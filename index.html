<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argos Trade B3 · Monitor</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Monitor do Argos Trade B3: tema claro, 5 abas. Lê simulado/* (robô) e o ramo "mercado" (cotações do dia). */
:root {
  color-scheme: light;
  --bg: #f4f7fb; --surface: #ffffff; --surface-2: #f8fafd; --line: #e2e8f1; --line-2: #cfd8e5;
  --ink: #0c1c3f; --ink-2: #33405c; --muted: #5d6880; --dim: #8b95a8;
  --brand: #1a62d6; --brand-soft: #e8f0fd; --cyan: #10b5d8;
  --pos: #16803a; --pos-soft: #e6f4ea; --neg: #c42b2b; --neg-soft: #fbeaea; --warn: #a15c00; --warn-soft: #fdf1df;
  --s1: #257de0; --s2: #f47230; --s3: #00b894; --s4: #f2a600; --s5: #ee7fac;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(12, 28, 63, .05), 0 4px 16px rgba(12, 28, 63, .05);
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
a { color: var(--brand); text-decoration: none; } a:hover { text-decoration: underline; }
button, select { font: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

/* topo */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand img { height: 60px; width: auto; display: block; }
.brand .t1 { font-weight: 800; font-size: 22px; letter-spacing: .06em; line-height: 1.1; }
.brand .t1 b { color: var(--brand); }
.brand .t2 { color: var(--muted); font-size: 13px; }
.status { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.pill.sim { background: var(--warn-soft); border-color: #f3d6a8; color: var(--warn); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.ok { background: var(--pos); box-shadow: 0 0 0 3px var(--pos-soft); }
.dot.late { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }

/* abas */
.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); margin: 0 -16px 14px; padding: 6px 16px; border-bottom: 1px solid var(--line); }
.tabs div { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs div::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: transparent; color: var(--muted); font-weight: 700; font-size: 14px; padding: 9px 14px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
.tabs button:hover { color: var(--ink); background: var(--surface); }
.tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }

/* cartões */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0 0 2px; font-weight: 700; }
.card .sub, .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
.grid { display: grid; gap: 14px; }
.two { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); margin-bottom: 14px; }
.half { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); margin-bottom: 14px; }
.full { margin-bottom: 14px; }
.pos { color: var(--pos); } .neg { color: var(--neg); }

/* destaque do resumo */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.hero.idx { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.hero .main .v { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.hero .main .r { font-size: 17px; font-weight: 800; margin-top: 4px; }
.kpi .lab { color: var(--muted); font-size: 12px; font-weight: 600; }
.kpi .v { font-size: 21px; font-weight: 800; margin-top: 4px; line-height: 1.15; }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 4px; }
.kpi .s.pos { color: var(--pos); } .kpi .s.neg { color: var(--neg); }

/* controles */
.chart-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.ctrls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface-2); max-width: 100%; }
.seg button { font-size: 12px; font-weight: 600; border: 0; background: transparent; color: var(--muted); padding: 5px 11px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
select.pick { font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); max-width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 4px 0 8px; }
.legend button, .legend span { font-size: 12.5px; color: var(--ink-2); background: none; border: 0; padding: 2px 0; display: inline-flex; align-items: center; gap: 6px; }
.legend button { cursor: pointer; } .legend button[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.legend i, .tip i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; flex: none; }
.chart { position: relative; }
.chart svg { width: 100%; display: block; overflow: visible; }
.chart .ax { fill: var(--dim); font-size: 11px; }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px;
  box-shadow: 0 6px 20px rgba(12, 28, 63, .12); font-size: 12px; min-width: 180px; display: none; z-index: 2; }
.tip .d { font-weight: 700; margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; gap: 12px; }
.tip .r span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.linkbtn { font-size: 12px; color: var(--brand); background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; }

/* tabelas */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 7px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 7px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.motivo { white-space: normal; min-width: 200px; color: var(--ink-2); }
td.solto { white-space: normal; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
.tk { font-weight: 700; }
.grp td { background: var(--surface-2); font-weight: 700; color: var(--ink-2); font-size: 12px; padding: 7px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.chip.buy { background: var(--pos-soft); color: var(--pos); }
.chip.sell { background: var(--neg-soft); color: var(--neg); }
.chip.info { background: var(--brand-soft); color: var(--brand); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.wbar { position: relative; width: 56px; height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; display: inline-block; vertical-align: middle; margin-right: 8px; }
.wbar span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--brand); }
.wbar em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.alvo { color: var(--muted); font-size: 11.5px; }

/* lista de ativos no celular */
.cards { display: none; list-style: none; margin: 0; padding: 0; }
.cards li { border-bottom: 1px solid var(--line); }
.cards li:last-child { border-bottom: 0; }
.cards li.g { background: var(--surface-2); font-weight: 700; font-size: 12px; color: var(--ink-2); padding: 7px 8px; border-radius: 8px; border: 0; margin-top: 6px; }
.cards button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; width: 100%; text-align: left; background: none; border: 0; padding: 10px 4px; cursor: pointer; color: inherit; }
.cards .l1 { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cards .l2 { color: var(--muted); font-size: 12px; grid-column: 1 / -1; }
.cards .rv { font-weight: 800; text-align: right; }

.blocks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.blk { border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; background: var(--surface-2); min-width: 0; }
.blk .lab { font-size: 12px; color: var(--muted); font-weight: 600; }
.blk .v { font-weight: 800; font-size: 17px; }
.blk .s { font-size: 12px; color: var(--muted); }

/* fechamento */
.resumo-dia { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); margin-bottom: 12px; font-size: 13px; }
.flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.step { border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; background: var(--surface-2); position: relative; }
.step .nm { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.step .v { font-weight: 800; font-size: 18px; margin-top: 2px; }
.step .s { font-size: 12px; color: var(--muted); }
.step:not(:last-child)::after { content: "→"; position: absolute; right: -11px; top: 50%; transform: translateY(-50%); color: var(--dim); font-weight: 700; z-index: 1; }
.log { margin: 8px 0 0; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
  font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; color: var(--ink-2); list-style: none; max-height: 220px; overflow: auto; }
.log li { white-space: pre-wrap; word-break: break-word; }
.alertas { margin: 0 0 10px; padding: 0; list-style: none; }
.alertas li { background: var(--warn-soft); border: 1px solid #f3d6a8; color: var(--ink-2); border-radius: 9px; padding: 7px 10px; margin-bottom: 6px; font-size: 12.5px; }
details summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--brand); margin-top: 10px; }

/* gatilhos */
.trig { list-style: none; margin: 0; padding: 0; }
.trig li { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.trig li:last-child { border-bottom: 0; }
.trig .bar { height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; position: relative; overflow: hidden; }
.trig .bar span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cyan); }
.trig .txt { font-size: 12px; color: var(--muted); }
.trig .val { font-size: 12.5px; font-weight: 700; text-align: right; }
.trig-h { font-size: 12px; font-weight: 700; color: var(--ink-2); margin: 12px 0 2px; text-transform: uppercase; letter-spacing: .04em; }
.trig-h:first-child { margin-top: 0; }

.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.rule { border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; }
.rule b { display: block; margin-bottom: 2px; }
.rule p { margin: 0; color: var(--muted); font-size: 12.5px; }
.empty { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 12px; background: var(--surface-2); }
.banner { background: var(--brand-soft); border: 1px solid #c9dcfa; color: var(--ink-2); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.totais { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-bottom: 10px; }
footer { color: var(--muted); font-size: 12px; margin-top: 24px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

@media (max-width: 980px) { .hero { grid-template-columns: repeat(3, minmax(0, 1fr)); } .hero .main { grid-column: 1 / -1; } .hero.idx { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) {
  .two, .half, .rules { grid-template-columns: minmax(0, 1fr); }
  .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } .step::after { display: none; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .hero { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hero .main .v { font-size: 28px; }
  .hero:not(.idx) .kpi:last-child { grid-column: 1 / -1; }
  .blocks { grid-template-columns: minmax(0, 1fr); } .brand img { height: 48px; } .brand .t1 { font-size: 18px; }
  .card { padding: 14px; }
  .so-desk { display: none; } .cards { display: block; }
  .tabs button { padding: 8px 11px; font-size: 13.5px; }
  .seg { overflow-x: auto; }
}
@media (max-width: 420px) { .tabs div { gap: 0; justify-content: space-between; } .tabs button { padding: 8px 8px; font-size: 13px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img src="assets/simbolo-argos-b3.png" alt="Símbolo Argos Trade B3" width="60" height="60">
      <div>
        <div class="t1">ARGOS TRADE <b>B3</b></div>
        <div class="t2">Monitor do robô · ações, dividendos e FIIs</div>
      </div>
    </div>
    <div class="status">
      <span class="pill sim">🧪 SIMULADO · dinheiro de mentira</span>
      <span class="pill"><i class="dot" id="runDot"></i><span id="runTxt">carregando…</span></span>
      <span class="pill" id="nextTxt">Próxima execução: --</span>
    </div>
  </header>

  <nav class="tabs" aria-label="Seções do monitor"><div role="tablist" id="tabs"></div></nav>
  <main id="app"><div class="empty">Carregando os dados do robô…</div></main>

  <footer>
    <span>Carteira simulada para estudo. Não é recomendação de investimento.</span>
    <span>Atualiza sozinho a cada 5 minutos · dados do Yahoo Finance e do Banco Central</span>
  </footer>
</div>

<script>
"use strict";
const REPO = "diogo385/argos-trade-b3";
const MERCADO_URLS = [`https://raw.githubusercontent.com/${REPO}/mercado/mercado.json`, "mercado.json"];
const ABAS = [["resumo", "Resumo"], ["mercado", "Mercado"], ["historico", "Histórico"], ["extrato", "Extrato"], ["regras", "Regras"]];
const SERIES = [
  { k: "patrimonio", n: "Robô", c: "var(--s1)", w: 2.6 },
  { k: "carteira_parada", n: "Carteira parada", c: "var(--s2)", w: 2 },
  { k: "cdi", n: "CDI líquido", c: "var(--s3)", w: 2 },
  { k: "ibovespa", n: "Ibovespa", c: "var(--s4)", w: 2 },
  { k: "ifix", n: "IFIX", c: "var(--s5)", w: 2 },
];
const GRUPOS_PADRAO = { valorizacao: ["BPAC11", "ITUB4", "EMBJ3", "PRIO3", "SBSP3", "WEGE3", "CURY3", "GGBR4", "AXIA3", "FLRY3"],
  dividendos: ["PETR4", "TAEE11", "CPLE3", "CXSE3", "VIVT3"], fiis: ["KNCR11", "BTLG11", "KNRI11", "VISC11", "MCCI11"] };
const NOMES = { valorizacao: "Valorização", dividendos: "Dividendos", fiis: "FIIs" };
const INDICES = { IBOV: "Ibovespa (pontos)", BOVA11: "BOVA11 · ETF do Ibovespa", XFIX11: "XFIX11 · ETF do IFIX" };
const REFORCO_1 = 0.85, REFORCO_2 = 0.75, TETO = 2, CORTE = { dividendos: 0.30, fiis: 0.25 };

let D = null, M = null, aba = "resumo";
const S = { vis: { patrimonio: true, carteira_parada: true, cdi: true, ibovespa: false, ifix: false }, modo: "reais", faixa: "tudo",
  ativo: null, ativoDia: null, ordemM: "carteira", fTipo: "todos", fAtivo: "", fMes: "", montagem: false, tabela: false };

// ---------- utilidades
const brl = (v, c = 2) => "R$ " + Number(v).toLocaleString("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c });
const n2 = (v, c = 2) => Number(v).toLocaleString("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c });
const pct = (v, c = 1) => (v >= 0 ? "+" : "−") + Math.abs(v * 100).toLocaleString("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c }) + "%";
const pc0 = (v, c = 1) => pct(v, c).replace("+", "");
const sinal = v => v > 0.00001 ? "pos" : v < -0.00001 ? "neg" : "";
const din = v => (v >= 0 ? "+" : "−") + brl(Math.abs(v));
const dataBR = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : "--";
const curta = s => `${s.slice(8, 10)}/${s.slice(5, 7)}`;
const mesBR = m => `${["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"][+m.slice(5, 7) - 1]}/${m.slice(2, 4)}`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const el = id => document.getElementById(id);
const grupos = () => D?.est.grupos || GRUPOS_PADRAO;

function csv(texto) {
  const linhas = [];
  let campo = "", linha = [], aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (aspas) { if (ch === '"' && texto[i + 1] === '"') { campo += '"'; i++; } else if (ch === '"') aspas = false; else campo += ch; }
    else if (ch === '"') aspas = true;
    else if (ch === ";") { linha.push(campo); campo = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && texto[i + 1] === "\n") i++;
      linha.push(campo); campo = "";
      if (linha.some(x => x !== "")) linhas.push(linha);
      linha = [];
    } else campo += ch;
  }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  if (!linhas.length) return [];
  const h = linhas.shift();
  return linhas.map(l => Object.fromEntries(h.map((k, i) => [k, l[i]])));
}
async function arquivo(nome, json) {
  const r = await fetch(`simulado/${nome}?t=${Date.now()}`, { cache: "no-store" });
  if (!r.ok) return null;
  return json ? r.json() : csv(await r.text());
}
async function mercado() {
  for (const u of MERCADO_URLS) {
    try { const r = await fetch(`${u}?t=${Date.now()}`, { cache: "no-store" }); if (r.ok) return await r.json(); } catch (e) { /* tenta a próxima */ }
  }
  return null;
}

// ---------- carga
async function carregar() {
  try {
    const [est, hist, ops, prov, precos, vetos, ir, merc] = await Promise.all([
      arquivo("estado.json", true), arquivo("historico.csv"), arquivo("operacoes.csv"), arquivo("proventos.csv"),
      arquivo("precos.json", true).catch(() => null), arquivo("vetos.csv"), arquivo("ir_mensal.csv"), mercado()]);
    M = merc;
    D = est ? { est, hist: (hist || []).map(h => ({ ...h, ...Object.fromEntries(SERIES.map(s => [s.k, +h[s.k]])), caixa: +h.caixa })),
      ops: ops || [], prov: prov || [], precos, vetos: vetos || [], ir: ir || [] } : null;
    render();
  } catch (e) {
    el("app").innerHTML = `<div class="empty">Não consegui ler os dados do robô agora (${esc(e.message)}). Tento de novo em 5 minutos.</div>`;
  }
  status();
}

const agoraBR = () => new Date(new Date().toLocaleString("en-US", { timeZone: "America/Sao_Paulo" }));
const isoDia = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function proximaExecucao() {
  const agora = agoraBR(), d = new Date(agora);
  d.setHours(19, 15, 0, 0);
  if (agora >= d) d.setDate(d.getDate() + 1);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  const dias = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  return d.toDateString() === agora.toDateString() ? "hoje, 19h15"
    : `${dias[d.getDay()]} ${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}, 19h15`;
}
// o robô deveria ter fechado o último dia útil (com folga até 21h15); feriado também cai aqui
function atrasado() {
  if (!D?.est.ultimo_pregao) return false;
  const agora = agoraBR(), d = new Date(agora);
  d.setHours(21, 15, 0, 0);
  if (agora < d) d.setDate(d.getDate() - 1);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() - 1);
  return D.est.ultimo_pregao < isoDia(d);
}
function status() {
  el("nextTxt").textContent = "Próxima execução: " + proximaExecucao();
  if (!D) { el("runDot").className = "dot"; el("runTxt").textContent = "aguardando o 1º fechamento"; return; }
  const late = atrasado();
  el("runDot").className = "dot " + (late ? "late" : "ok");
  el("runTxt").textContent = `Último fechamento: ${dataBR(D.est.ultimo_pregao)}` + (late ? " · atraso ou feriado" : "");
}

// ---------- cálculos
function posicoes() {
  const e = D.est, c = e.carteira, px = e.precos || {};
  const total = c.caixa + Object.entries(c.qtd).reduce((s, [a, q]) => s + q * (px[a] || 0), 0);
  const alvo = total * (1 - e.reserva / e.capital) / 20, lin = [];
  for (const [g, lista] of Object.entries(e.grupos)) for (const a of lista) {
    const q = c.qtd[a] || 0, p = px[a], v = q * p, pm = c.pm[a];
    lin.push({ g, a, q, p, v, pm, peso: v / total, rel: v / alvo, res: pm ? p / pm - 1 : null,
      fora: e.fora?.[a], ref: e.reforcos?.[a] || 0, alerta: e.alertado?.[a], saude: e.saude_proventos?.[a] });
  }
  return { total, alvo, lin };
}
const gatilhoReforco = x => x.pm && (x.ref || 0) < 2 ? x.pm * (!x.ref ? REFORCO_1 : REFORCO_2 / REFORCO_1) : null;
function situacao(x) {
  if (x.fora) return `<span class="chip sell">Fora</span>`;
  if (x.alerta) return `<span class="chip warn">Em observação</span>`;
  if (x.rel > TETO * 0.9) return `<span class="chip info">Perto do teto</span>`;
  if (x.ref) return `<span class="chip buy">Reforço ${x.ref}×</span>`;
  if (x.pm && x.p <= x.pm * (REFORCO_1 + 0.04)) return `<span class="chip warn">Perto reforço</span>`;
  return `<span class="chip ok">Normal</span>`;
}
function recorte(h) {
  if (S.faixa === "tudo" || !h.length) return h;
  const fim = new Date(h[h.length - 1].data), ini = new Date(fim);
  ini.setMonth(ini.getMonth() - (S.faixa === "1m" ? 1 : 3));
  const r = h.filter(x => new Date(x.data) >= ini);
  return r.length >= 2 ? r : h.slice(-2);
}

// ---------- gráfico de linhas genérico (cruz, dica, rótulos diretos e linhas de referência)
function linhas(boxId, o) {
  const box = el(boxId);
  if (!box) return;
  const n = o.rotulos.length;
  if (n < 2) { box.innerHTML = `<div class="empty">${o.vazio || "O gráfico aparece a partir do segundo ponto."}</div>`; return; }
  const W = box.clientWidth || 800, estreito = W < 560, H = o.altura || (window.innerWidth <= 640 ? 230 : 290);
  const m = { l: 58, r: estreito ? 12 : 104, t: 10, b: 26 }, refs = o.refs || [];
  const vals = o.series.flatMap(s => s.v).concat(refs.map(r => r.v)).filter(v => v != null && isFinite(v));
  if (!vals.length) { box.innerHTML = `<div class="empty">Escolha ao menos uma série na legenda.</div>`; return; }
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.08 || Math.abs(hi) * 0.01 || 1; lo -= pad; hi += pad;
  const X = i => m.l + i * (W - m.l - m.r) / (n - 1), Y = v => m.t + (hi - v) * (H - m.t - m.b) / (hi - lo);
  const ty = Array.from({ length: 5 }, (_, i) => lo + (hi - lo) * i / 4), nx = Math.min(estreito ? 4 : 6, n);
  const tx = Array.from({ length: nx }, (_, i) => Math.round(i * (n - 1) / (nx - 1)));
  const caminho = v => { let d = "", on = false; v.forEach((y, i) => { if (y == null) { on = false; return; } d += `${on ? "L" : "M"}${X(i).toFixed(1)},${Y(y).toFixed(1)}`; on = true; }); return d; };
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="height:${H}px" role="img" aria-label="${esc(o.titulo)}">`;
  svg += ty.map(v => `<line class="grid-l" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax num" x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${o.eixo(v)}</text>`).join("");
  svg += tx.map(i => `<text class="ax num" x="${X(i)}" y="${H - 6}" text-anchor="middle">${esc(o.rotulos[i])}</text>`).join("");
  const fins = o.series.map(s => { let i = s.v.length - 1; while (i >= 0 && s.v[i] == null) i--; return i < 0 ? null : { n: s.n, c: s.c, y: Y(s.v[i]), y0: Y(s.v[i]), x: X(i), forte: s.w > 2.2, ponto: true }; }).filter(Boolean)
    .concat(refs.map(r => ({ n: r.n, c: r.c, y: Y(r.v), y0: Y(r.v), ponto: false }))).sort((a, b) => a.y - b.y);
  for (let i = 1; i < fins.length; i++) if (fins[i].y - fins[i - 1].y < 14) fins[i].y = fins[i - 1].y + 14;
  svg += refs.map(r => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(r.v)}" y2="${Y(r.v)}" stroke="${r.c}" stroke-width="1.5" stroke-dasharray="5 4"/>`).join("");
  svg += o.series.slice().sort((a, b) => a.w - b.w).map(s => `<path d="${caminho(s.v)}" fill="none" stroke="${s.c}" stroke-width="${s.w}" stroke-linejoin="round" stroke-linecap="round"/>`).join("");
  svg += fins.map(f => (f.ponto ? `<circle cx="${f.x}" cy="${f.y0}" r="4" fill="${f.c}" stroke="var(--surface)" stroke-width="2"/>` : "") +
    (estreito ? "" : `<text x="${W - m.r + 10}" y="${f.y + 4}" font-size="11.5" fill="var(--ink-2)" font-weight="${f.forte ? 700 : 500}">${esc(f.n)}</text>`)).join("");
  svg += `<line class="cx" y1="${m.t}" y2="${H - m.b}" stroke="var(--dim)" visibility="hidden"/><g class="hd"></g>
    <rect class="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/></svg><div class="tip"></div>`;
  box.innerHTML = svg;
  const hit = box.querySelector(".hit"), tip = box.querySelector(".tip"), cross = box.querySelector(".cx"), dots = box.querySelector(".hd");
  const mover = ev => {
    const r = box.querySelector("svg").getBoundingClientRect(), sx = W / r.width;
    const px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) * sx;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - m.l) / ((W - m.l - m.r) / (n - 1)))));
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("visibility", "visible");
    const vivos = o.series.filter(s => s.v[i] != null);
    dots.innerHTML = vivos.map(s => `<circle cx="${X(i)}" cy="${Y(s.v[i])}" r="4.5" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/>`).join("");
    tip.innerHTML = `<div class="d">${esc(o.dica ? o.dica(i) : o.rotulos[i])}</div>` + vivos.slice().sort((a, b) => b.v[i] - a.v[i]).map(s =>
      `<div class="r"><span><i style="background:${s.c}"></i>${esc(s.n)}</span><b class="num">${o.valor(s.v[i])}</b></div>`).join("") + (o.extra ? o.extra(i) : "");
    tip.style.display = "block";
    const left = X(i) / sx, w = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(r.width - w, left + (left > r.width / 2 ? -w - 14 : 14))) + "px"; tip.style.top = "10px";
  };
  const sair = () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); dots.innerHTML = ""; };
  hit.addEventListener("mousemove", mover); hit.addEventListener("touchmove", mover, { passive: true });
  hit.addEventListener("mouseleave", sair); hit.addEventListener("touchend", sair);
}

  </section>

  <section class="card full">
    <div class="chart-head">
      <div><h2>Robô contra as referências</h2><p class="sub">Todas começam com ${brl(ini, 0)} no mesmo dia. Toque na legenda para ligar ou desligar Ibovespa e IFIX.</p></div>

function dResumo() {
  const h = recorte(D.hist), ss = SERIES.filter(s => S.vis[s.k]), base = h[0] || {};
  const val = (x, k) => S.modo === "pct" ? x[k] / base[k] - 1 : x[k];
  linhas("gPat", { titulo: "Patrimônio do robô e das referências ao longo do tempo", rotulos: h.map(x => curta(x.data)), dica: i => dataBR(h[i].data),
    series: ss.map(s => ({ n: s.n, c: s.c, w: s.w, v: h.map(x => val(x, s.k)) })),
    eixo: v => S.modo === "pct" ? pct(v, 1) : n2(v, 0), valor: v => S.modo === "pct" ? pct(v, 2) : brl(v),
    vazio: "O gráfico aparece a partir do segundo fechamento." + (h.length ? ` Hoje: robô ${brl(h[0].patrimonio)}.` : "") });
}

function fechamento(lin) {
  const e = D.est, f = e.fechamento, c = e.carteira;

  const perto = lin.filter(x => x.q && gatilhoReforco(x) && !x.fora).map(x => ({ a: x.a, d: x.p / gatilhoReforco(x) - 1 })).sort((a, b) => a.d - b.d)[0];
  const quando = e.ultima_execucao ? `${curta(e.ultima_execucao.slice(0, 10))} às ${e.ultima_execucao.slice(11, 16)}` : "--";
  const calmo = !f.operacoes && !f.vetos.length && !prob.length && tel;
  const passo = (nm, v, s, cls = "") => `<div class="step"><div class="nm">${nm}</div><div class="v num ${cls}">${v}</div><div class="s">${s}</div></div>`;

    : `<div class="flow">

      ${passo("Porteiro", `${f.aprovadas} / ${f.vetos.length}`, "aprovadas / vetadas", f.vetos.length ? "neg" : "")}
      ${passo("Executor", f.operacoes, f.operacoes === 1 ? "operação executada" : "operações executadas")}
      ${passo("Telegram", tel ? "Enviado" : "Falhou", tel ? "resumo do dia entregue" : "mensagem não entregue", tel ? "pos" : "neg")}
    </div>`}
    ${f.alertas?.length ? `<ul class="alertas">${f.alertas.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}

    <div class="tiles">

      ${tile("Última operação", ult ? `${ult.tipo === "COMPRA" ? "Compra" : "Venda"} ${esc(ult.ativo)}` : "—", ult ? `${dataBR(ult.data)} · ${brl(+ult.valor)}` : "nenhuma ainda")}
      ${tile("Mais perto de agir", perto ? perto.a : "—", perto ? (perto.d <= 0 ? "no gatilho de reforço" : `falta cair ${pc0(perto.d)} para o reforço`) : "")}
      ${tile("Custos e IR pagos", brl(c.custos + c.ir_pago), `custos ${brl(c.custos)} · IR ${brl(c.ir_pago)}`)}
    </div>
    <details><summary>Ver o registro completo do fechamento</summary><ul class="log">${(f.registro || []).map(l => `<li>${esc(l)}</li>`).join("")}</ul></details>
  </section>`;
}

function gatilhos(lin) {
  const ativos = lin.filter(x => x.q && x.pm && !x.fora);
  const reforco = ativos.filter(gatilhoReforco).map(x => ({ ...x, gat: gatilhoReforco(x), falta: x.p / gatilhoReforco(x) - 1 })).sort((a, b) => a.falta - b.falta).slice(0, 5);
  const lucro = ativos.slice().sort((a, b) => b.rel - a.rel).slice(0, 4);
  // proventos: distância até o corte (0 = estável ou subindo, 1 = no corte)
  const saude = lin.filter(x => x.g !== "valorizacao" && x.saude != null).map(x => ({ ...x, perto: Math.max(0, Math.min(1, -x.saude / CORTE[x.g])) })).sort((a, b) => b.perto - a.perto).slice(0, 5);
  const item = (tk, prog, txt, val) => `<li><span class="tk">${tk}</span><div><div class="bar" aria-hidden="true"><span style="width:${Math.max(2, Math.min(100, prog * 100))}%"></span></div><div class="txt">${txt}</div></div><span class="val num">${val}</span></li>`;
  const nada = t => `<li><span></span><span class="txt">${t}</span><span></span></li>`;
  return `
    <div class="trig-h">Reforço (compra na queda)</div>
    <ul class="trig">${reforco.length ? reforco.map(x => item(x.a, 1 - Math.max(0, x.falta) / 0.2, `${x.ref + 1}º reforço a ${brl(x.gat)} · hoje ${brl(x.p)}`,
      x.falta <= 0 ? "no gatilho" : "falta cair " + pc0(x.falta))).join("") : nada("Nenhum ativo elegível.")}</ul>
    <div class="trig-h">Realização de lucro (vende o excesso)</div>
    <ul class="trig">${lucro.map(x => item(x.a, x.rel / TETO, `age em 2,00× o alvo · hoje ${n2(x.rel)}×`, x.rel >= TETO ? "no gatilho" : `falta subir ${pc0(TETO / x.rel - 1, 0)}`)).join("")}</ul>

  <section class="card full">
    <h2>Imposto de renda (simulado)</h2><p class="sub">Apuração de cada mês, em R$. Ações ficam isentas com vendas até R$ 20 mil no mês; FIIs pagam 20% sobre o lucro.</p>
    ${D.ir.length ? `<div class="tbl-wrap"><table><thead><tr><th>Mês</th><th class="r">Vendas de ações</th><th class="r">Lucro em ações</th><th>Isento</th><th class="r">Lucro em FIIs</th><th class="r">IR devido</th></tr></thead><tbody>
      ${D.ir.slice().reverse().map(x => `<tr><td class="num">${mesBR(x.mes)}</td><td class="r num">${n2(+x.vendas_acoes)}</td><td class="r num ${sinal(+x.ganho_acoes)}">${n2(+x.ganho_acoes)}</td><td>${esc(x.isento_acoes)}</td>
        <td class="r num ${sinal(+x.ganho_fiis)}">${n2(+x.ganho_fiis)}</td><td class="r num">${n2(+x.ir_devido)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">A primeira apuração aparece na virada do mês.</div>`}
  </section>`;
}

// =====================================================================  REGRAS
function tRegras() {
  const t = D?.est.travas || {}, p = (v, d) => ((v ?? d) * 100).toFixed(0), gh = `https://github.com/${REPO}/blob/main/`;
  const linha = (a, b) => `<tr><td class="solto">${a}</td><td class="r solto">${b}</td></tr>`;
  return `
  <section class="card full">
    <h2>Como o robô decide</h2><p class="sub">Regras da versão V3, a que foi melhor no teste com dados passados. Ele decide sozinho uma vez por dia útil, no fechamento (19h15), e não afrouxa nenhuma regra por conta própria.</p>
    <div class="rules">
      <div class="rule"><b>🟢 Quando compra mais</b><p>Ativo 15% abaixo do preço médio: compra cerca de R$ 250 com a reserva. Segundo reforço com mais 12% de queda. Limites: 2 reforços por mês, até R$ 750 de custo por ativo, nada de reforço em ativo que já caiu mais de 40% ou que está em observação, e só com proventos em dia.</p></div>
      <div class="rule"><b>🔵 Quando realiza lucro</b><p>No primeiro pregão de cada trimestre, o que passou do alvo é vendido e o que ficou abaixo é completado. É aqui que o lucro é realizado de verdade. A venda fora de hora, quando a posição passa de 2× o alvo, é rara. FIIs só recebem compras, porque vender cota paga 20% de IR.</p></div>
      <div class="rule"><b>🔴 Quando sai</b><p><b style="display:inline">Dividendos e FIIs:</b> proventos de 12 meses 30% (ações) ou 25% (FIIs) abaixo da média dos 3 anos anteriores, por 40 pregões seguidos: vende tudo e volta quando se recuperam. <b style="display:inline">Valorização:</b> 35% abaixo do topo e abaixo da média de 200 dias: entra em observação; depois de 60 pregões assim, vende metade.</p></div>
    </div>
  </section>
  <section class="grid half">
    <div class="card"><h2>Carteira e dinheiro</h2><p class="sub">R$ 6.000 de mentira desde 25/11/2026.</p>
      <div class="tbl-wrap"><table><tbody>
        ${linha("10 ações de valorização", "R$ 250 cada")}${linha("5 ações de dividendos", "R$ 250 cada")}${linha("5 FIIs", "R$ 250 cada")}
        ${linha("Reserva para reforços", "R$ 1.000, rendendo CDI")}${linha("Custo por operação", "0,13% (B3 e diferença de preço)")}
        ${linha("O que o robô não enxerga", "lucro, dívida e notícias: isso fica para a revisão trimestral, feita sozinha em 22/03, 22/05, 22/08 e 22/11")}
        ${linha("Réguas a vencer", "CDI líquido, carteira parada, Ibovespa e IFIX")}</tbody></table></div></div>
    <div class="card"><h2>Porteiro de risco</h2><p class="sub">Toda ordem passa por estas travas. Os vetos aparecem no Extrato.</p>
      <div class="tbl-wrap"><table><tbody>
        ${linha("Valor por ordem", `até ${p(t.ordem_max, .15)}% do patrimônio`)}${linha("Operações por dia", `até ${t.max_ops_dia ?? 8}, fora do rebalanceamento`)}
        ${linha("Cotação que não é do dia", "não opera no ativo")}${linha(`Salto acima de ${p(t.salto_suspeito, .25)}% sem desdobramento`, "dado suspeito: não opera")}
        ${linha(`Movimento acima de ${p(t.vol_max_dia, .10)}% no dia`, "não opera no ativo")}${linha("Compra e venda do mesmo ativo no dia", "proibido (sem day trade)")}
        ${linha("Vendas de ações no mês", `trava em ${brl(t.vendas_mes_limite ?? 19000, 0)} (isenção de IR)`)}${linha("Caixa ou quantidade negativa", "para tudo e avisa")}</tbody></table></div></div>
  </section>
  <section class="grid half">
    <div class="card"><h2>Avisos no Telegram</h2><p class="sub">O que chega e o que o robô faz em cada caso.</p>
      <div class="tbl-wrap"><table><tbody>
        ${linha("📊 Fechamento, todo dia útil", "operações, vetos, proventos e patrimônio")}${linha("🗓️ Relatório semanal, na sexta", "semana contra as referências")}
        ${linha("ℹ️ Informativo", "continua operando")}${linha("⏸️ Pausa no ativo", "pula o ativo e retoma sozinho")}
        ${linha("🛑 Parada técnica", "não altera a carteira; tenta no dia seguinte")}${linha("🚨 Urgente", "para tudo e não grava")}
        ${linha("📵 Sinal de vida, às 21h15", "dispara o robô se ele não rodou")}</tbody></table></div></div>
    <div class="card"><h2>Quando avançar e quando desistir</h2><p class="sub">Critérios combinados antes de pensar em dinheiro real.</p>
      <div class="tbl-wrap"><table><tbody>
        ${linha("Tempo de simulado", "pelo menos 90 dias e uma revisão trimestral")}${linha("Falhas", "nenhuma parada sem causa entendida")}
        ${linha("Contra a carteira parada", "no máximo 5 pontos atrás")}${linha("Desistir se", "em 6 meses perder da carteira parada e do CDI")}</tbody></table></div>
      <p class="sub" style="margin:12px 0 0">Documentos: <a href="${gh}PLANO.md">plano</a> · <a href="${gh}ANALISE.md">análise dos ativos</a> · <a href="${gh}backtest/ROBO_REGRAS.md">teste das regras</a></p></div>
  </section>`;
}

// =====================================================================  navegação e eventos
function render() {
  el("tabs").innerHTML = ABAS.map(([k, n]) => `<button type="button" role="tab" id="tab-${k}" aria-selected="${aba === k}" aria-controls="app" data-aba="${k}">${n}</button>`).join("");
  const app = el("app"); app.setAttribute("role", "tabpanel"); app.setAttribute("aria-labelledby", "tab-" + aba);
  app.innerHTML = { resumo: tResumo, mercado: tMercado, historico: tHistorico, extrato: tExtrato, regras: tRegras }[aba]();
  if (aba === "resumo" && D) dResumo();
  if (aba === "mercado") dMercado();
  if (aba === "historico" && D) dHistorico();
  status();
}
function ir(nova, alvo) {
  aba = nova; history.replaceState(null, "", "#" + nova); render();
  (alvo ? el(alvo) : document.querySelector(".tabs"))?.scrollIntoView({ block: "start" });
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-aba],[data-faixa],[data-modo],[data-serie],[data-ativo],[data-dia],[data-ordem],[data-ftipo],#btnTabela,#btnMont,#btnLimpar,#btnLimpar2");
  if (!t) return;
  const d = t.dataset;
  if (d.aba) return ir(d.aba);
  if (d.ativo) { S.ativo = d.ativo; return ir("historico", "secAtivo"); }
  if (d.faixa) S.faixa = d.faixa; else if (d.modo) S.modo = d.modo; else if (d.serie) S.vis[d.serie] = !S.vis[d.serie];
  else if (d.dia) S.ativoDia = d.dia; else if (d.ordem) S.ordemM = d.ordem; else if (d.ftipo) S.fTipo = d.ftipo;
  else if (t.id === "btnTabela") S.tabela = !S.tabela; else if (t.id === "btnMont") S.montagem = true;
  else if (t.id.startsWith("btnLimpar")) { S.fTipo = "todos"; S.fAtivo = ""; S.fMes = ""; S.montagem = false; }
  render();
  if (d.dia && window.innerWidth <= 860) el("secDia")?.scrollIntoView({ block: "start" });
});
document.addEventListener("change", ev => {
  const id = ev.target.id, v = ev.target.value;
  if (id === "pickDia") S.ativoDia = v; else if (id === "pickHist") S.ativo = v; else if (id === "fAtivo") S.fAtivo = v; else if (id === "fMes") S.fMes = v; else return;
  render();
});
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.matches("tr.click")) ev.target.click(); });
const inicial = location.hash.slice(1); if (ABAS.some(a => a[0] === inicial)) aba = inicial;
let rz, larg = window.innerWidth;
window.addEventListener("resize", () => { if (window.innerWidth === larg) return; larg = window.innerWidth; clearTimeout(rz); rz = setTimeout(render, 150); });
carregar();
setInterval(carregar, 5 * 60 * 1000);
setInterval(status, 60 * 1000);
</script>
</body>
</html>
